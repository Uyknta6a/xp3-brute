name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --locked --release --bin xp3brute --target x86_64-pc-windows-msvc

      - name: Package Windows binary
        shell: pwsh
        run: |
          $buildId = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "manual-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $package = "xp3brute-$buildId-x86_64-pc-windows-msvc"

          New-Item -ItemType Directory -Path $package -Force | Out-Null

          Copy-Item "target/x86_64-pc-windows-msvc/release/xp3brute.exe" "$package/"
          Copy-Item README.md "$package/" -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_NOTICES.md "$package/" -ErrorAction SilentlyContinue

          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp3brute-windows
          path: xp3brute-*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    # 只要是 Tag 触发或者手动点击 workflow_dispatch 触发，都执行发布
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    needs:
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: xp3brute-windows
          path: dist

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum xp3brute-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 如果是 tag 触发就用 tag 名，如果是手动触发就用 manual-<commit-id> 作为版本名
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="manual-${GITHUB_SHA:0:7}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --generate-notes \
              --title "$TAG"
          fi